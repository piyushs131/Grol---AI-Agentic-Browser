# Upstream browser engine this build is pinned to. Bump deliberately: re-sync,
# re-apply the patch series, fix what moved, rebuild.
ENGINE_REF=d52ebdcb3de1e3479f464dfc267856256ca7c6aa   # 156.0.8067.0

# The engine checkout (~100 GB, regenerable). Kept outside the repo.
ENGINE_ROOT="${GROL_ENGINE_ROOT:-$HOME/grol-engine}"

# Upstream names the scripts need: depot_tools fetch recipe, build output bundle
