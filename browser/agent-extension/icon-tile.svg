<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Toolbar / tab icon: the ring on a white tile so it reads on any toolbar. -->
  <defs>
    <linearGradient id="ring" x1="10" y1="8" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#fff"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#ring)" stroke-width="8"/>
</svg>
